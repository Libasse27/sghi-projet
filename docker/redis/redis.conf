# Configuration Redis pour SGHI

# Bind to all interfaces
bind 0.0.0.0

# Port
port 6379

# Enable password (set via docker-compose environment)
# requirepass will be set via command in docker-compose

# Max memory policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# AOF persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Timeout
timeout 300

# TCP keepalive
tcp-keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""
